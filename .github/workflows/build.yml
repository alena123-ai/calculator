name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK with Buildozer Docker
      run: |
        docker run --rm \
          -v "${{ github.workspace }}":/home/user/hostcwd \
          -v ~/.buildozer:/home/user/.buildozer \
          kivy/buildozer:latest \
          android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: ${{ github.workspace }}/bin/*.apk
